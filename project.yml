# XcodeGen の設定。`xcodegen generate` で Pinshelf.xcodeproj を作る
name: Pinshelf
options:
  bundleIdPrefix: app.nexy
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ja

# ビルドの設定は 3 つ。Install は make install 用で、配る版と同じ最適化（release）のまま、開発のビルドとして入れる
configs:
  Debug: debug
  Release: release
  Install: release

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  # 画面に依存しない中心のロジック（`swift test` でも同じソースを使う）。
  # アプリに埋め込むフレームワークにすると、自前の証明書で署名したときに読み込みを断られることがあるので、静的ライブラリにする
  PinshelfCore:
    type: library.static
    platform: macOS
    sources:
      - path: PinshelfCore/Sources/PinshelfCore
    settings:
      base:
        PRODUCT_NAME: PinshelfCore
        SKIP_INSTALL: YES

  PinshelfCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PinshelfCore/Tests/PinshelfCoreTests
    dependencies:
      - target: PinshelfCore
    settings:
      base:
        # Xcode のテストのターゲット（make test は PinshelfCore の swift test で流すので、こちらは Xcode から使うときだけ）
        PRODUCT_BUNDLE_IDENTIFIER: app.nexy.Pinshelf.tests
        GENERATE_INFOPLIST_FILE: YES
        # テストも開発用の証明書で署名する（Pin シリーズの決まり。アドホック署名は ADHOC=1 のときだけ。Pinshot と同じ）
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: nexy Dev Signing
        DEVELOPMENT_TEAM: ""

  Pinshelf:
    type: application
    platform: macOS
    sources:
      - path: Pinshelf
    dependencies:
      - target: PinshelfCore
      # 更新の仕組み（Sparkle）。make が Vendor/Sparkle に取り寄せたものを、アプリに入れる
      - framework: Vendor/Sparkle/Sparkle.framework
        embed: true
    info:
      path: Pinshelf/Info.plist
      properties:
        # 画面に出る名前。配る版は Pinshelf、開発のビルドは Pinshelf Dev（下の settings の PINSHELF_DISPLAY_NAME で分ける）
        CFBundleDisplayName: $(PINSHELF_DISPLAY_NAME)
        CFBundleDevelopmentRegion: ja
        # 日本語のアプリだと宣言する（しないと、文字の欄の右クリックなど、macOS の部品が英語で出る）
        CFBundleLocalizations:
          - ja
        # アプリの版（make dist・make publish もここから読む）。1.0.0 より前は β 版（設定画面にも「β 版」と出る）。
        # 出すたびに上げる。CFBundleVersion（ビルド番号）も 1 つずつ上げる
        CFBundleShortVersionString: "0.1.2"
        CFBundleVersion: "3"
        LSApplicationCategoryType: public.app-category.productivity
        # メニューバーに常駐し、Dock には出さない
        LSUIElement: true
        NSHumanReadableCopyright: ""
        # 更新（Sparkle）。版の一覧（appcast.xml）の場所。組織 nexy-apps の GitHub Pages に置く（配ったあとは変えない）
        SUFeedURL: https://nexy-apps.github.io/pinshelf/appcast.xml
        # 更新ファイルの署名を確かめる公開鍵（下の settings の PINSHELF_UPDATE_PUBLIC_KEY。空のビルドでは、更新の機能を出さない）
        SUPublicEDKey: $(PINSHELF_UPDATE_PUBLIC_KEY)
        # 新しい版を自動で確かめる（1 時間に 1 回。Sparkle が受け付けるいちばん短い間隔。設定の「一般」で切れる）
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 3600
        # サンドボックスの中からは自分を入れ替えられないので、Sparkle の入れ替え役（XPC サービス）に任せる
        SUEnableInstallerLauncherService: true
    entitlements:
      path: Pinshelf/Pinshelf.entitlements
      properties:
        # App Store に出せるようにサンドボックスを有効にする
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # 再起動後も棚のファイルを開けるように、security-scoped bookmark を使う
        com.apple.security.files.bookmarks.app-scope: true
        # 更新の確認とダウンロードで、GitHub に接続する
        com.apple.security.network.client: true
        # Sparkle の入れ替え役と通信する（名前は Sparkle の決まり）
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
        # Team ID のない署名（アドホック署名・自己署名）では、Hardened Runtime のままだと、
        # アプリに入れた Sparkle の読み込みを断られるので、ライブラリの検証を切る
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        # アプリの ID。配る版は app.nexy.Pinshelf、開発のビルドは後ろに .dev を付ける（決まりは共通のノート「Pinシリーズの決まり」）
        PRODUCT_BUNDLE_IDENTIFIER: app.nexy.Pinshelf
        PRODUCT_NAME: Pinshelf
        PINSHELF_DISPLAY_NAME: Pinshelf
        # 更新ファイルの署名を確かめる公開鍵（秘密鍵は、作者の金庫の中。アカウント名 nexy-release）
        PINSHELF_UPDATE_PUBLIC_KEY: "btZMA9m6IhHTFewQG183f6jcLXfvO+GlDfEzWSmZZ28="
        # 署名は、自分で作った証明書で行う（Apple の Developer ID は使わない）。証明書は下の configs で分ける
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        # 型は既定で MainActor にする（画面まわりのコードが多いため）
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        GENERATE_INFOPLIST_FILE: NO
        # アプリのアイコン（scripts/make-app-icon.swift で描いて、make icon で書き出す）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # 開発のビルド（make build・make run）: 別の ID・別の名前・開発用の証明書。更新の機能は出さない（公開鍵を空にする）。
        # Debug ではアプリのコードを Pinshelf.debug.dylib に分けて読み込む。
        # 自前の証明書で署名しても読み込みを断られないよう、Debug だけ Hardened Runtime を切る
        Debug:
          <<: &dev
            PRODUCT_BUNDLE_IDENTIFIER: app.nexy.Pinshelf.dev
            PINSHELF_DISPLAY_NAME: Pinshelf Dev
            PINSHELF_UPDATE_PUBLIC_KEY: ""
            CODE_SIGN_IDENTITY: nexy Dev Signing
          ENABLE_HARDENED_RUNTIME: NO
        # make install: 配る版と同じ作り（最適化・Hardened Runtime・get-task-allow なし）で、ID・名前・証明書は開発のビルドと同じ
        Install:
          <<: *dev
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        # 配る版: 配る版用の証明書（nexy Release Signing。作者の金庫の中）。名前は誰でも同じものを作れるので、SHA-1 で選ぶ
        # （make dist もここから読む）。make dist が金庫を開けてから使う。Xcode から直接ビルドすると、
        # 金庫が検索リストにないので「No certificate matching …」で止まる（アドホック署名にはならない）。
        # デバッガをつなぐための許可（get-task-allow）を入れない（何もしないと、Xcode がビルドのときに足す）
        Release:
          CODE_SIGN_IDENTITY: F84FBC463E4889FC6FED2DEF2DC27A9310DB57FC
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

schemes:
  Pinshelf:
    build:
      targets:
        Pinshelf: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PinshelfCoreTests
